<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发送消息 · 粉色</title>
<!-- 点击发送后输入框清空，发送图标飞出再复位。　节奏：2.4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E52A81;--ld-main-d:#D52175;--ld-accent:#DF5E9A;--ld-accent-l:#F392BF;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#AD175D;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 发送消息 */
.ld-send{display:flex;align-items:center;gap:10px;width:260px;height:48px;padding:0 6px 0 16px;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.08);overflow:hidden}
.ld-send .tx{flex:1;font-size:13.5px;color:var(--ld-ink);white-space:nowrap;animation:ld-tx 2.4s ease infinite}
.ld-send .b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ld-main);overflow:hidden}
.ld-send svg{width:18px;height:18px;fill:#fff;animation:ld-pl 2.4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes ld-tx{0%,30%{opacity:1;transform:none}45%,80%{opacity:0;transform:translateX(30px)}95%,100%{opacity:1;transform:none}}
@keyframes ld-pl{0%,25%{transform:translate(0,0)}45%{transform:translate(30px,-30px);opacity:1}46%{transform:translate(-30px,30px);opacity:0}60%{opacity:1}70%,100%{transform:translate(0,0)}}
@media (prefers-reduced-motion: reduce){.ld-send,.ld-send *,.ld-send *::before,.ld-send *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-send" role="status" aria-label="发送中">
  <span class="tx">明天下午三点可以吗？</span>
  <span class="b"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-6.5 18-3-7.5z"/></svg></span>
</div>
<!-- ▲ 到这里结束 -->
</body>
</html>
