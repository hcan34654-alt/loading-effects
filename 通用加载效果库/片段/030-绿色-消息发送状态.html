<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消息发送状态 · 绿色</title>
<!-- 气泡下方依次显示发送中、已送达、已读。用于聊天、评论。　节奏：约 4.4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#299E63;--ld-main-d:#298C5A;--ld-accent:#3AAF75;--ld-accent-l:#4CD38F;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1F7148;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 消息发送状态 */
.ld-msg{display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:220px}
.ld-msg .b{padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--ld-main);color:#fff;font-size:14px;transition:opacity .3s}
.ld-msg[data-s=sending] .b{opacity:.6}
.ld-msg .st{display:inline-flex;align-items:center;gap:5px;height:16px;font-size:11.5px;color:var(--ld-mute)}
.ld-msg .sp{flex:none;display:inline-block;box-sizing:border-box;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-msg svg{width:18px;height:12px;fill:none;stroke:var(--ld-mute);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ld-msg .c2{opacity:0}
.ld-msg[data-s=sending] svg,.ld-msg:not([data-s=sending]) .sp{display:none}
.ld-msg[data-s=read] svg{stroke:var(--ld-main)}
.ld-msg[data-s=read] .c2{opacity:1}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-msg,.ld-msg *,.ld-msg *::before,.ld-msg *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-msg" data-s="sending"><div class="b">好的，明天下午见</div><span class="st" role="status"><i class="sp"></i><svg viewBox="0 0 18 12"><path d="M1 6.5l3 3L10 3"/><path class="c2" d="M8 9.5l6.5-6.5"/></svg><span class="t">发送中</span></span></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-msg'),t=c.querySelector('.t');
  while(true){
    c.dataset.s='sending';t.textContent='发送中';await W(1300);
    c.dataset.s='sent';t.textContent='已送达';await W(1400);
    c.dataset.s='read';t.textContent='已读';await W(1700);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
