<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章骨架 · 黑灰色</title>
<!-- 粗标题、作者行、整段正文的骨架。　节奏：1.4 秒 shimmer -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#2E2E2E;--ld-main-d:#2B2B2B;--ld-accent:#8E8E8E;--ld-accent-l:#989898;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#262626;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 文章骨架 */
.ld-skarticle{display:flex;flex-direction:column;gap:9px;width:260px;padding:18px;border-radius:16px;background:#fff}
.ld-skarticle .h{height:15px;border-radius:5px;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
.ld-skarticle .m{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.ld-skarticle .m i{width:22px;height:22px;border-radius:50%;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
.ld-skarticle .m b,.ld-skarticle .p{height:7px;border-radius:4px;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
@keyframes ld-shim{from{background-position:150% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion: reduce){.ld-skarticle,.ld-skarticle *,.ld-skarticle *::before,.ld-skarticle *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-skarticle" role="status" aria-busy="true" aria-label="文章加载中"><div class="h" style="width:92%"></div><div class="h" style="width:58%"></div><div class="m"><i></i><b style="width:90px"></b></div><div class="p" style="width:100%"></div><div class="p" style="width:96%"></div><div class="p" style="width:100%"></div><div class="p" style="width:64%"></div></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
