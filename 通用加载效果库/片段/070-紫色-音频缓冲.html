<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音频缓冲 · 紫色</title>
<!-- 点播放后按钮里转圈、时间显示「--:--」，可以播了再换成暂停键并走进度。　节奏：约 5.5 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#8C49CF;--ld-main-d:#803AC6;--ld-accent:#A477D2;--ld-accent-l:#CAAAEA;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#662CA0;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 音频缓冲 */
.ld-audio{display:flex;align-items:center;gap:12px;width:260px;padding:12px 14px;box-sizing:border-box;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-audio .btn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ld-main)}
.ld-audio .btn>*{grid-area:1/1;transition:opacity .2s}
.ld-audio .sp{flex:none;display:inline-block;box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:ld-rot .8s linear infinite}
.ld-audio .pa{width:12px;height:14px;border-left:4px solid #fff;border-right:4px solid #fff;box-sizing:border-box;opacity:0}
.ld-audio[data-s=play] .sp{opacity:0}
.ld-audio[data-s=play] .pa{opacity:1}
.ld-audio .mid{flex:1;min-width:0}
.ld-audio .top{display:flex;justify-content:space-between;align-items:baseline}
.ld-audio b{font-size:13px;color:var(--ld-ink)}
.ld-audio .tm{font:11px var(--ld-num);color:var(--ld-mute);font-variant-numeric:tabular-nums}
.ld-audio .tr{height:4px;margin-top:9px;border-radius:2px;background:var(--ld-track);overflow:hidden}
.ld-audio[data-s=load] .tr{background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
.ld-audio .tr i{display:block;width:0;height:100%;border-radius:inherit;background:var(--ld-main)}
.ld-audio[data-s=play] .tr i{animation:ld-ap 4s linear forwards}
@keyframes ld-ap{to{width:30%}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@keyframes ld-shim{from{background-position:150% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion: reduce){.ld-audio,.ld-audio *,.ld-audio *::before,.ld-audio *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-audio" data-s="load" role="status"><span class="btn"><i class="sp"></i><i class="pa"></i></span><div class="mid"><div class="top"><b>播客 · 第 12 期</b><span class="tm">--:--</span></div><div class="tr"><i></i></div></div></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-audio'),tm=c.querySelector('.tm');
  while(true){
    c.dataset.s='load';tm.textContent='--:--';await W(1500);
    c.dataset.s='play';
    for(let s=0;s<4;s++){tm.textContent='00:0'+s+' / 03:25';await W(1000);}
  }
}catch(e){}})();
})();
</script>
</body>
</html>
