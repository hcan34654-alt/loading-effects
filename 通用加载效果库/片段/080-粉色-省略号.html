<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>省略号 · 粉色</title>
<!-- 「加载中」后面的三个点依次出现。用于行内文字状态。　节奏：1.6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E52A81;--ld-main-d:#D52175;--ld-accent:#DF5E9A;--ld-accent-l:#F392BF;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#AD175D;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 省略号 */
.ld-ell{font-size:17px;font-weight:600;color:var(--ld-ink)}
.ld-ell i{font-style:normal;color:var(--ld-main)}
.ld-ell i:nth-child(1){animation:ld-e1 1.6s steps(1,end) infinite}
.ld-ell i:nth-child(2){animation:ld-e2 1.6s steps(1,end) infinite}
.ld-ell i:nth-child(3){animation:ld-e3 1.6s steps(1,end) infinite}
@keyframes ld-e1{0%,25%{opacity:0}30%,85%{opacity:1}95%,100%{opacity:0}}
@keyframes ld-e2{0%,50%{opacity:0}55%,85%{opacity:1}95%,100%{opacity:0}}
@keyframes ld-e3{0%,75%{opacity:0}80%,85%{opacity:1}95%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ld-ell,.ld-ell *,.ld-ell *::before,.ld-ell *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<span class="ld-ell" role="status">加载中<i>.</i><i>.</i><i>.</i></span>
<!-- ▲ 到这里结束 -->
</body>
</html>
