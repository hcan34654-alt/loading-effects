<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伸缩弧线 · 蓝色</title>
<!-- 弧线旋转的同时伸长、缩短。通用加载。　节奏：1.5 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#2F79DB;--ld-main-d:#296EC8;--ld-accent:#6093D7;--ld-accent-l:#90B9ED;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1E57A2;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 伸缩弧线 */
.ld-arc{width:56px;height:56px;animation:ld-rot 2s linear infinite}
.ld-arc circle{fill:none;stroke-width:4.5;stroke-linecap:round;animation:ld-dash 1.5s ease-in-out infinite,ld-arcc 3s ease-in-out infinite}
@keyframes ld-dash{0%{stroke-dasharray:1 150;stroke-dashoffset:0}50%{stroke-dasharray:90 150;stroke-dashoffset:-35}100%{stroke-dasharray:90 150;stroke-dashoffset:-124}}
@keyframes ld-arcc{0%,100%{stroke:var(--ld-main)}50%{stroke:var(--ld-accent)}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-arc,.ld-arc *,.ld-arc *::before,.ld-arc *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<svg class="ld-arc" viewBox="0 0 50 50" role="status" aria-label="加载中"><circle cx="25" cy="25" r="20"/></svg>
<!-- ▲ 到这里结束 -->
</body>
</html>
