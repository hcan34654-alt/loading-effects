<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆周点阵 · 靛色</title>
<!-- 八个圆点围成一圈，依次变亮。通用加载。　节奏：1 秒一圈 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#5155D7;--ld-main-d:#4045CD;--ld-accent:#8285D9;--ld-accent-l:#BABCF0;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#2A2EAD;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 圆周点阵 */
.ld-dotc{position:relative;width:54px;height:54px}
.ld-dotc i{position:absolute;left:50%;top:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ld-main);transform-origin:5px 27px;animation:ld-dotf 1s linear infinite}
.ld-dotc i:nth-child(1){transform:rotate(0deg);animation-delay:-1.000s;background:var(--ld-accent)}
.ld-dotc i:nth-child(2){transform:rotate(45deg);animation-delay:-0.875s}
.ld-dotc i:nth-child(3){transform:rotate(90deg);animation-delay:-0.750s}
.ld-dotc i:nth-child(4){transform:rotate(135deg);animation-delay:-0.625s}
.ld-dotc i:nth-child(5){transform:rotate(180deg);animation-delay:-0.500s}
.ld-dotc i:nth-child(6){transform:rotate(225deg);animation-delay:-0.375s}
.ld-dotc i:nth-child(7){transform:rotate(270deg);animation-delay:-0.250s}
.ld-dotc i:nth-child(8){transform:rotate(315deg);animation-delay:-0.125s}
@keyframes ld-dotf{0%{opacity:1}100%{opacity:.12}}
@media (prefers-reduced-motion: reduce){.ld-dotc,.ld-dotc *,.ld-dotc *::before,.ld-dotc *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-dotc" role="status" aria-label="加载中"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
