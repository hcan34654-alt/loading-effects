<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轮播自动进度 · 橙色</title>
<!-- 顶部分段条显示当前这张还要停留多久，走满自动切到下一张。　节奏：每张 2 秒 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E3651C;--ld-main-d:#C95D1F;--ld-accent:#DC834F;--ld-accent-l:#F1A87E;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A34A16;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 轮播自动进度 */
.ld-story{position:relative;width:230px;height:140px;border-radius:12px;background:#2A2F38;overflow:hidden}
.ld-story .sl{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box;color:#fff;font-size:15px;font-weight:700;opacity:0}
.ld-story .sl:nth-child(1){background:linear-gradient(135deg,#E88043,#B55A26);animation:ld-sl0 6s infinite}
.ld-story .sl:nth-child(2){background:linear-gradient(135deg,#D97941,#B7571F);animation:ld-sl1 6s infinite}
.ld-story .sl:nth-child(3){background:linear-gradient(135deg,#8C624A,#5E3E2C);animation:ld-sl2 6s infinite}
.ld-story .bars{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:4px}
.ld-story .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.ld-story .bars i::after{content:"";display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.ld-story .bars i:nth-child(1)::after{animation:ld-sb0 6s linear infinite}
.ld-story .bars i:nth-child(2)::after{animation:ld-sb1 6s linear infinite}
.ld-story .bars i:nth-child(3)::after{animation:ld-sb2 6s linear infinite}
@keyframes ld-sb0{0%,0.0%{transform:scaleX(0)}33.3%,98%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes ld-sb1{0%,33.3%{transform:scaleX(0)}66.6%,98%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes ld-sb2{0%,66.6%{transform:scaleX(0)}99.9%,98%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes ld-sl0{0%,32%{opacity:1}35%,97%{opacity:0}100%{opacity:1}}
@keyframes ld-sl1{0%,31.3%{opacity:0}35.3%,65.6%{opacity:1}68.6%,100%{opacity:0}}
@keyframes ld-sl2{0%,64.6%{opacity:0}68.6%,98.9%{opacity:1}101.9%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ld-story,.ld-story *,.ld-story *::before,.ld-story *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-story"><div class="sl">新品上线</div><div class="sl">限时 8 折</div><div class="sl">会员日</div><div class="bars" aria-hidden="true"><i></i><i></i><i></i></div></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
