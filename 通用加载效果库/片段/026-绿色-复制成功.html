<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>复制成功 · 绿色</title>
<!-- 复制图标换成对勾，文字换成「已复制」，随后复位。　节奏：2.4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#299E63;--ld-main-d:#298C5A;--ld-accent:#3AAF75;--ld-accent-l:#4CD38F;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1F7148;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 复制成功 */
.ld-copy{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--ld-line);font-size:14px;color:var(--ld-ink2);animation:ld-cpb 2.4s ease infinite}
.ld-copy .ic{position:relative;width:18px;height:18px}
.ld-copy svg{position:absolute;inset:0;width:18px;height:18px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ld-copy .cp{stroke:currentColor;animation:ld-cpo 2.4s ease infinite}
.ld-copy .ok{stroke:var(--ld-ok)}
.ld-copy .ok path{stroke-dasharray:16;stroke-dashoffset:16;animation:ld-cpk 2.4s ease infinite}
.ld-copy .lb{display:grid}
.ld-copy .lb span{grid-area:1/1}
.ld-copy .l1{animation:ld-l1 2.4s ease infinite}
.ld-copy .l2{color:var(--ld-ok);opacity:0;animation:ld-l2 2.4s ease infinite}
@keyframes ld-cpo{0%,25%{transform:scale(1);opacity:1}35%,85%{transform:scale(.4);opacity:0}95%,100%{transform:scale(1);opacity:1}}
@keyframes ld-cpk{0%,32%{stroke-dashoffset:16}45%,85%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:16}}
@keyframes ld-l1{0%,28%{opacity:1}34%,88%{opacity:0}95%,100%{opacity:1}}
@keyframes ld-l2{0%,30%{opacity:0;transform:translateY(4px)}38%,85%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes ld-cpb{0%,28%,92%,100%{border-color:var(--ld-line);background:#fff}36%,85%{border-color:#A7E3C5;background:#ECFDF4}}
@media (prefers-reduced-motion: reduce){.ld-copy,.ld-copy *,.ld-copy *::before,.ld-copy *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<span class="ld-copy" role="status">
  <span class="ic"><svg class="cp" viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 4H5a1 1 0 0 0-1 1v8"/></svg><svg class="ok" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7"/></svg></span>
  <span class="lb"><span class="l1">复制链接</span><span class="l2">已复制</span></span>
</span>
<!-- ▲ 到这里结束 -->
</body>
</html>
