<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片占位加载 · 橙色</title>
<!-- 图片没回来前显示灰底和图片图标，加载完淡入替换，尺寸提前占好不跳动。　节奏：4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E3651C;--ld-main-d:#C95D1F;--ld-accent:#DC834F;--ld-accent-l:#F1A87E;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A34A16;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 图片占位加载 */
.ld-imgph{position:relative;width:230px;height:144px;border-radius:12px;background:#E9ECF1;overflow:hidden}
.ld-imgph .ph{position:absolute;inset:0;display:grid;place-items:center;animation:ld-php 1.4s ease-in-out infinite}
.ld-imgph .ph svg{width:44px;height:44px;fill:none;stroke:#B4BAC5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ld-imgph .im{position:absolute;inset:0;background:radial-gradient(circle at 74% 30%,#FFDAC4 0 8%,transparent 9%),linear-gradient(to top,#B8683A 0 22%,transparent 22%),linear-gradient(165deg,#FBB58D,#F69E6B 55%,#E08B5A);animation:ld-imin 4s ease infinite}
@keyframes ld-php{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes ld-imin{0%,40%{opacity:0;transform:scale(1.03)}55%,88%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ld-imgph,.ld-imgph *,.ld-imgph *::before,.ld-imgph *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-imgph" role="img" aria-label="图片加载中"><span class="ph"><svg viewBox="0 0 44 44"><rect x="4" y="7" width="36" height="30" rx="4"/><circle cx="14" cy="17" r="3"/><path d="M4 31l10-9 8 7 6-5 12 10"/></svg></span><span class="im"></span></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
