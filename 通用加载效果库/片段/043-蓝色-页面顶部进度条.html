<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面顶部进度条 · 蓝色</title>
<!-- 页面顶部的细条先快后慢地前进，加载完走满并消失。用于页面跳转。　节奏：3.6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#2F79DB;--ld-main-d:#296EC8;--ld-accent:#6093D7;--ld-accent-l:#90B9ED;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1E57A2;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 页面顶部进度条 */
.ld-nprog{position:relative;width:250px;height:140px;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-nprog .bar{position:absolute;left:0;top:0;height:3px;border-radius:0 2px 2px 0;background:var(--ld-main);box-shadow:0 0 8px rgba(47,121,219,.6);animation:ld-np 3.6s infinite}
.ld-nprog .pg{display:flex;flex-direction:column;gap:10px;padding:22px 16px 0;animation:ld-npg 3.6s infinite}
.ld-nprog .pg b{height:9px;border-radius:5px;background:var(--ld-track)}
.ld-nprog .pg b:first-child{height:16px;margin-bottom:4px;background:#E1E4EA}
@keyframes ld-np{0%{width:0;opacity:1}15%{width:32%}35%{width:54%}55%{width:68%}72%{width:76%;opacity:1}82%{width:100%;opacity:1}92%,100%{width:100%;opacity:0}}
@keyframes ld-npg{0%,78%{opacity:.4}86%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.ld-nprog,.ld-nprog *,.ld-nprog *::before,.ld-nprog *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-nprog" role="progressbar" aria-label="页面加载中"><span class="bar"></span><div class="pg" aria-hidden="true"><b style="width:42%"></b><b style="width:92%"></b><b style="width:78%"></b><b style="width:86%"></b><b style="width:60%"></b></div></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
