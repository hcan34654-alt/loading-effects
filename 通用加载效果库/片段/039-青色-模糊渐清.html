<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模糊渐清 · 青色</title>
<!-- 图片先显示模糊缩略图，加载完变清晰。　节奏：4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#229AAA;--ld-main-d:#238997;--ld-accent:#34ACBC;--ld-accent-l:#49CCDD;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1A6F7A;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 模糊渐清 */
.ld-blur{width:240px;height:150px;border-radius:14px;overflow:hidden;background:#EEF0F4}
.ld-blur i{display:block;width:100%;height:100%;background:radial-gradient(60% 70% at 30% 70%,#2CCADF 0,transparent 70%),radial-gradient(50% 60% at 75% 30%,#28B5C7 0,transparent 70%),linear-gradient(160deg,#C2F8FF,#43D2E5 55%,#277D88);animation:ld-blur 4s ease-in-out infinite}
@keyframes ld-blur{0%,25%{filter:blur(16px) saturate(.7);transform:scale(1.12)}45%,85%{filter:none;transform:none}100%{filter:blur(16px) saturate(.7);transform:scale(1.12)}}
.ld-cap{margin:12px 0 0;font-size:12.5px;color:var(--ld-ink2);text-align:center}
@media (prefers-reduced-motion: reduce){.ld-blur,.ld-blur *,.ld-blur *::before,.ld-blur *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div><div class="ld-blur" role="img" aria-label="图片加载中"><i></i></div><p class="ld-cap">图片加载中</p></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
