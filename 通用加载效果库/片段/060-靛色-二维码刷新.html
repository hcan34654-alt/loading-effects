<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二维码刷新 · 靛色</title>
<!-- 二维码过期后变淡并盖上刷新按钮，点击后转圈，新码回来恢复清晰。　节奏：约 4.3 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#5155D7;--ld-main-d:#4045CD;--ld-accent:#8285D9;--ld-accent-l:#BABCF0;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#2A2EAD;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 二维码刷新 */
.ld-qr{position:relative;width:132px;height:132px;padding:10px;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-qr .q{display:block;width:132px;height:132px;fill:var(--ld-ink);transition:opacity .3s,filter .3s}
.ld-qr .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ld-ink);opacity:0;transition:opacity .3s}
.ld-qr .rf{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ld-main)}
.ld-qr .rf svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ld-qr .sp{flex:none;display:inline-block;box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:ld-rot .8s linear infinite}
.ld-qr:not([data-s=ok]) .q{opacity:.12;filter:blur(1.5px)}
.ld-qr:not([data-s=ok]) .ov{opacity:1}
.ld-qr[data-s=load] .rf svg,.ld-qr[data-s=expired] .sp,.ld-qr[data-s=ok] .sp{display:none}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-qr,.ld-qr *,.ld-qr *::before,.ld-qr *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>

<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-qr'),t=c.querySelector('.t');
  while(true){
    c.dataset.s='ok';await W(2000);
    c.dataset.s='expired';t.textContent='二维码已过期';await W(1300);
    c.dataset.s='load';t.textContent='刷新中';await W(1000);
  }
}catch(e){}})();
})();
</script>
