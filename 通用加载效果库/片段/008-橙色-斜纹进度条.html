<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斜纹进度条 · 橙色</title>
<!-- 带滚动斜纹的进度条。用于下载、导出。　节奏：0.8 秒滚动 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E3651C;--ld-main-d:#C95D1F;--ld-accent:#DC834F;--ld-accent-l:#F1A87E;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A34A16;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 斜纹进度条 */
.ld-stripew{width:240px}
.ld-stripe{height:14px;border-radius:7px;background:#FBECE3;overflow:hidden}
.ld-stripe i{display:block;height:100%;width:60%;border-radius:inherit;background:repeating-linear-gradient(45deg,var(--ld-main) 0 10px,#F08243 10px 20px);background-size:28.28px 28.28px;animation:ld-stripe .8s linear infinite,ld-grow 4s ease-in-out infinite alternate}
@keyframes ld-stripe{to{background-position:28.28px 0}}
@keyframes ld-grow{from{width:12%}to{width:94%}}
.ld-cap{margin:12px 0 0;font-size:12.5px;color:var(--ld-ink2);text-align:center}
@media (prefers-reduced-motion: reduce){.ld-stripe,.ld-stripe *,.ld-stripe *::before,.ld-stripe *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-stripew" role="progressbar" aria-label="下载中"><div class="ld-stripe"><i></i></div><p class="ld-cap">正在下载文件</p></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
