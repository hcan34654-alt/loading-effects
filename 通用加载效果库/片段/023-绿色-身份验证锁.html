<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>身份验证锁 · 绿色</title>
<!-- 锁图标内转圈，验证通过后开锁并变绿。用于登录、二次验证。　节奏：3 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#299E63;--ld-main-d:#298C5A;--ld-accent:#3AAF75;--ld-accent-l:#4CD38F;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1F7148;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 身份验证锁 */
.ld-lock{display:flex;flex-direction:column;align-items:center}
.ld-lock svg{width:70px;height:84px;overflow:visible}
.ld-lock .sh{fill:none;stroke:var(--ld-ink);stroke-width:5;stroke-linecap:round;transform-box:view-box;transform-origin:51px 40px;animation:ld-shk 3s var(--ld-ease) infinite}
.ld-lock .bd{fill:var(--ld-main);animation:ld-lbd 3s ease infinite}
.ld-lock .sp{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 40;transform-box:fill-box;transform-origin:center;animation:ld-rot .8s linear infinite,ld-lsp 3s ease infinite}
.ld-lock .ok{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;animation:ld-lok 3s ease infinite}
@keyframes ld-shk{0%,50%{transform:none}60%,88%{transform:translateY(-9px) rotate(28deg)}96%,100%{transform:none}}
@keyframes ld-lbd{0%,50%{fill:var(--ld-main)}58%,88%{fill:var(--ld-ok)}96%,100%{fill:var(--ld-main)}}
@keyframes ld-lsp{0%,48%{opacity:1}52%,100%{opacity:0}}
@keyframes ld-lok{0%,52%{stroke-dashoffset:20}62%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:20}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
.ld-cap{margin:12px 0 0;font-size:12.5px;color:var(--ld-ink2);text-align:center}
@media (prefers-reduced-motion: reduce){.ld-lock,.ld-lock *,.ld-lock *::before,.ld-lock *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-lock" role="status" aria-live="polite">
  <svg viewBox="0 0 70 84"><path class="sh" d="M19 40V26a16 16 0 0 1 32 0v14"/><rect class="bd" x="9" y="38" width="52" height="42" rx="9"/>
    <circle class="sp" cx="35" cy="59" r="8"/><path class="ok" d="M26 59l6 6 12-12"/></svg>
  <p class="ld-cap">身份验证中</p>
</div>
<!-- ▲ 到这里结束 -->
</body>
</html>
