<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动保存状态 · 绿色</title>
<!-- 编辑区右上角的小状态：未保存、保存中、已保存。　节奏：约 4.5 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#299E63;--ld-main-d:#298C5A;--ld-accent:#3AAF75;--ld-accent-l:#4CD38F;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1F7148;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 自动保存状态 */
.ld-autosave{width:250px;padding:14px 16px;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-autosave .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ld-autosave .hd b{font-size:14px;color:var(--ld-ink)}
.ld-autosave .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ld-mute);transition:color .3s}
.ld-autosave .ic{position:relative;width:14px;height:14px}
.ld-autosave .ic>*{position:absolute;inset:0;opacity:0;transition:opacity .2s}
.ld-autosave .dot{inset:4px;border-radius:50%;background:#2EB672}
.ld-autosave .sp{flex:none;display:inline-block;box-sizing:border-box;width:14px;height:14px;border-radius:50%;border:2px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-autosave .ck{fill:none;stroke:var(--ld-ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ld-autosave[data-s=dirty] .dot,.ld-autosave[data-s=saving] .sp,.ld-autosave[data-s=saved] .ck{opacity:1}
.ld-autosave[data-s=saved] .st{color:var(--ld-ok)}
.ld-autosave .ln{height:8px;margin-top:8px;border-radius:4px;background:var(--ld-track)}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-autosave,.ld-autosave *,.ld-autosave *::before,.ld-autosave *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-autosave" data-s="dirty"><div class="hd"><b>未命名文档</b><span class="st" role="status"><span class="ic"><i class="dot"></i><i class="sp"></i><svg class="ck" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7"/></svg></span><span class="t">有未保存的修改</span></span></div><div class="ln" style="width:92%"></div><div class="ln" style="width:78%"></div><div class="ln" style="width:60%"></div></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-autosave'),t=c.querySelector('.t');
  while(true){
    c.dataset.s='dirty';t.textContent='有未保存的修改';await W(1400);
    c.dataset.s='saving';t.textContent='保存中…';await W(1200);
    c.dataset.s='saved';t.textContent='已保存';await W(1800);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
