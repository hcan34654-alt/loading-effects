<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柱状图加载 · 粉色</title>
<!-- 坐标轴先出现，柱子从底部依次长到实际高度。　节奏：3 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E52A81;--ld-main-d:#D52175;--ld-accent:#DF5E9A;--ld-accent-l:#F392BF;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#AD175D;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 柱状图加载 */
.ld-bars{display:flex;align-items:flex-end;gap:12px;width:220px;height:120px;padding:0 10px;border-bottom:2px solid var(--ld-line);background:repeating-linear-gradient(to top,transparent 0 29px,#F1F2F5 29px 30px)}
.ld-bars i{flex:1;height:var(--h);border-radius:4px 4px 0 0;background:var(--ld-main);transform-origin:bottom;animation:ld-grow 3s var(--ld-ease) infinite both}
.ld-bars i:nth-child(1){--h:45%;animation-delay:0.0s}
.ld-bars i:nth-child(2){--h:70%;animation-delay:0.1s}
.ld-bars i:nth-child(3){--h:55%;animation-delay:0.2s}
.ld-bars i:nth-child(4){--h:90%;animation-delay:0.3s;background:var(--ld-accent)}
.ld-bars i:nth-child(5){--h:65%;animation-delay:0.4s}
.ld-bars i:nth-child(6){--h:80%;animation-delay:0.5s}
@keyframes ld-grow{0%{transform:scaleY(0);opacity:1}25%,85%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@media (prefers-reduced-motion: reduce){.ld-bars,.ld-bars *,.ld-bars *::before,.ld-bars *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-bars" role="img" aria-label="图表加载中"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
