<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九宫格 · 紫色</title>
<!-- 九个方块沿对角线方向依次缩放。通用加载。　节奏：1.3 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#8C49CF;--ld-main-d:#803AC6;--ld-accent:#A477D2;--ld-accent-l:#CAAAEA;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#662CA0;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 九宫格 */
.ld-grid9{display:grid;grid-template-columns:repeat(3,16px);gap:4px}
.ld-grid9 i{width:16px;height:16px;border-radius:3px;background:var(--ld-main);animation:ld-g9 1.3s ease-in-out infinite}
.ld-grid9 i:nth-child(1){animation-delay:0.2s}
.ld-grid9 i:nth-child(2){animation-delay:0.3s}
.ld-grid9 i:nth-child(3){animation-delay:0.4s}
.ld-grid9 i:nth-child(4){animation-delay:0.1s}
.ld-grid9 i:nth-child(5){animation-delay:0.2s}
.ld-grid9 i:nth-child(6){animation-delay:0.3s}
.ld-grid9 i:nth-child(7){animation-delay:0.0s}
.ld-grid9 i:nth-child(8){animation-delay:0.1s}
.ld-grid9 i:nth-child(9){animation-delay:0.2s}
@keyframes ld-g9{0%,70%,100%{transform:scale(1);opacity:1}35%{transform:scale(0);opacity:.3}}
@media (prefers-reduced-motion: reduce){.ld-grid9,.ld-grid9 *,.ld-grid9 *::before,.ld-grid9 *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-grid9" role="status" aria-label="加载中"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
