<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音输入波形 · 红色</title>
<!-- 麦克风外圈扩散，旁边是跳动的音量条。用于语音输入、录音中。　节奏：0.7–1.3 秒错落 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E31C29;--ld-main-d:#C91F2A;--ld-accent:#DC4F58;--ld-accent-l:#F17E86;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A3161F;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 语音输入波形 */
.ld-voice{display:flex;flex-direction:column;align-items:center;gap:14px}
.ld-voice .row{display:flex;align-items:center;gap:18px}
.ld-voice .mic{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ld-main);box-shadow:0 8px 18px rgba(227,28,41,.3)}
.ld-voice .mic::before,.ld-voice .mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ld-main);animation:ld-ripple 2s ease-out infinite}
.ld-voice .mic::after{animation-delay:1s}
.ld-voice .mic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.ld-voice .bars{display:flex;align-items:center;gap:4px;height:40px}
.ld-voice .bars i{width:4px;height:40px;border-radius:2px;background:linear-gradient(var(--ld-main),var(--ld-accent));transform:scaleY(.2);animation:ld-bar var(--d,1s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.ld-voice .bars i:nth-child(1){--d:.9s;--a:.45}.ld-voice .bars i:nth-child(2){--d:1.1s;--a:.7;--dl:-.3s}
.ld-voice .bars i:nth-child(3){--d:.8s;--a:1;--dl:-.5s}.ld-voice .bars i:nth-child(4){--d:1.3s;--a:.8;--dl:-.2s}
.ld-voice .bars i:nth-child(5){--d:1s;--a:.95;--dl:-.7s}.ld-voice .bars i:nth-child(6){--d:.7s;--a:.6;--dl:-.1s}
.ld-voice .bars i:nth-child(7){--d:1.2s;--a:.85;--dl:-.4s}.ld-voice .bars i:nth-child(8){--d:.95s;--a:.5;--dl:-.6s}
.ld-voice .bars i:nth-child(9){--d:1.05s;--a:.35;--dl:-.25s}
.ld-voice small{font-size:13px;color:var(--ld-ink2)}
@keyframes ld-bar{0%,100%{transform:scaleY(.18)}50%{transform:scaleY(var(--a,1))}}
@keyframes ld-ripple{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion: reduce){.ld-voice,.ld-voice *,.ld-voice *::before,.ld-voice *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-voice" role="status" aria-label="正在听">
  <div class="row">
    <span class="mic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <small>正在听…</small>
</div>
<!-- ▲ 到这里结束 -->
</body>
</html>
