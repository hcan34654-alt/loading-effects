<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表格行刷新 · 青色</title>
<!-- 只刷新一行时，那一行扫过一道浅色光，状态标签随后更新。　节奏：约 3.8 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#229AAA;--ld-main-d:#238997;--ld-accent:#34ACBC;--ld-accent-l:#49CCDD;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1A6F7A;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 表格行刷新 */
.ld-rowref{width:260px;border-radius:12px;background:#fff;overflow:hidden;font-size:12.5px}
.ld-rowref .r{position:relative;display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 14px;border-bottom:1px solid #F1F2F5;color:var(--ld-ink2);overflow:hidden}
.ld-rowref .r:last-child{border-bottom:0}
.ld-rowref .tag{position:relative;z-index:1;padding:2px 8px;border-radius:999px;font-size:11.5px;background:#ECFBFD;color:#15535B;transition:background .3s,color .3s}
.ld-rowref .cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(34,154,170,.09),transparent);transform:translateX(-100%)}
.ld-rowref[data-s=load] .cur::after{animation:ld-sweep 1.1s linear infinite}
.ld-rowref[data-s=load] .cur .tag{background:#E0FBFF;color:#176873}
.ld-rowref[data-s=done] .cur{animation:ld-rowflash 1.2s}
@keyframes ld-sweep{to{transform:translateX(100%)}}
@keyframes ld-rowflash{0%{background:#ECFBFD}100%{background:#fff}}
@media (prefers-reduced-motion: reduce){.ld-rowref,.ld-rowref *,.ld-rowref *::before,.ld-rowref *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-rowref" data-s="load"><div class="r">订单 #1024<span class="tag">已完成</span></div><div class="r cur">订单 #1025<span class="tag" role="status">处理中</span></div><div class="r">订单 #1026<span class="tag">已完成</span></div></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-rowref'),t=c.querySelector('.cur .tag');
  while(true){
    c.dataset.s='load';t.textContent='处理中';await W(1900);
    c.dataset.s='done';t.textContent='已完成';await W(1900);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
