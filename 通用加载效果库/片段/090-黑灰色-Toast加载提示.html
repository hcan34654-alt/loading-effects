<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toast 加载提示 · 黑灰色</title>
<!-- 深色胶囊：转圈加「正在保存」，完成后换成对勾加「已保存」再消失。　节奏：3.6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#2E2E2E;--ld-main-d:#2B2B2B;--ld-accent:#8E8E8E;--ld-accent-l:#989898;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#262626;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* Toast 加载提示 */
.ld-toast{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:22px;background:rgba(20,24,31,.92);color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(20,24,31,.25);animation:ld-tin 3.6s var(--ld-ease) infinite}
.ld-toast .ic{position:relative;width:18px;height:18px}
.ld-toast .ic>*{position:absolute;inset:0}
.ld-toast .sp{flex:none;display:inline-block;box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:ld-rot .8s linear infinite}
.ld-toast .sp{animation:ld-rot .8s linear infinite,ld-ta 3.6s infinite}
.ld-toast .ck{fill:none;stroke:#373737;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ld-toast .ck path{stroke-dasharray:16;animation:ld-tck 3.6s infinite}
.ld-toast .lb{display:grid}
.ld-toast .lb span{grid-area:1/1;white-space:nowrap}
.ld-toast .l1{animation:ld-ta 3.6s infinite}
.ld-toast .l2{animation:ld-tb 3.6s infinite}
@keyframes ld-tin{0%{opacity:0;transform:translateY(14px)}8%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes ld-ta{0%,48%{opacity:1}54%,100%{opacity:0}}
@keyframes ld-tb{0%,50%{opacity:0}56%,100%{opacity:1}}
@keyframes ld-tck{0%,52%{stroke-dashoffset:16}62%,100%{stroke-dashoffset:0}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-toast,.ld-toast *,.ld-toast *::before,.ld-toast *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-toast" role="status"><span class="ic"><i class="sp"></i><svg class="ck" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7"/></svg></span><span class="lb"><span class="l1">正在保存</span><span class="l2">已保存</span></span></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
