<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饼形进度 · 紫色</title>
<!-- 实心扇形随进度扩大到整圆，下方显示百分比。适合小尺寸的进度显示。　节奏：约 4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#8C49CF;--ld-main-d:#803AC6;--ld-accent:#A477D2;--ld-accent-l:#CAAAEA;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#662CA0;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 饼形进度 */
.ld-pie{display:flex;flex-direction:column;align-items:center;gap:10px}
.ld-pie i{width:76px;height:76px;border-radius:50%;border:3px solid var(--ld-main);box-sizing:border-box;background:conic-gradient(var(--ld-main) calc(var(--p,0)*1%),transparent 0);background-clip:content-box;padding:4px}
.ld-pie span{font:600 13px var(--ld-num);color:var(--ld-ink2);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.ld-pie,.ld-pie *,.ld-pie *::before,.ld-pie *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-pie" role="progressbar" aria-label="进度"><i></i><span>0%</span></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-pie'),i=c.querySelector('i'),t=c.querySelector('span');
  while(true){
    for(let p=0;p<=100;p+=2){i.style.setProperty('--p',p);t.textContent=p+'%';await W(60);}
    await W(1200);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
