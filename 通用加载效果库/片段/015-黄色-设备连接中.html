<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备连接中 · 黄色</title>
<!-- 两台设备之间的圆点依次亮起。用于蓝牙配对、投屏、扫码登录后的连接。　节奏：1.2 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E3A71C;--ld-main-d:#C9961F;--ld-accent:#DCB24F;--ld-accent-l:#F1CE7E;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A37916;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 设备连接中 */
.ld-pair{display:flex;flex-direction:column;align-items:center;gap:12px}
.ld-pair .row{display:flex;align-items:center;gap:14px}
.ld-pair svg{height:44px;fill:none;stroke:var(--ld-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ld-pair .ph{width:28px}
.ld-pair .lp{width:56px}
.ld-pair .ds{display:flex;gap:7px}
.ld-pair .ds i{width:7px;height:7px;border-radius:50%;background:var(--ld-main);opacity:.2;animation:ld-pr 1.2s ease-in-out infinite}
.ld-pair .ds i:nth-child(2){animation-delay:.15s}
.ld-pair .ds i:nth-child(3){animation-delay:.3s}
.ld-pair .ds i:nth-child(4){animation-delay:.45s}
.ld-pair p{margin:0;font-size:12.5px;color:var(--ld-ink2)}
@keyframes ld-pr{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){.ld-pair,.ld-pair *,.ld-pair *::before,.ld-pair *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-pair" role="status"><div class="row"><svg class="ph" viewBox="0 0 28 44" aria-hidden="true"><rect x="3" y="3" width="22" height="38" rx="5"/><path d="M11 35h6"/></svg><span class="ds" aria-hidden="true"><i></i><i></i><i></i><i></i></span><svg class="lp" viewBox="0 0 56 44" aria-hidden="true"><rect x="9" y="7" width="38" height="25" rx="3"/><path d="M3 38h50"/></svg></div><p>正在连接设备…</p></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
