<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仪表盘骨架 · 黑灰色</title>
<!-- 三个指标块加一块图表的骨架。用于数据看板首屏。　节奏：1.4 秒 shimmer -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#2E2E2E;--ld-main-d:#2B2B2B;--ld-accent:#8E8E8E;--ld-accent-l:#989898;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#262626;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 仪表盘骨架 */
.ld-skdash{width:260px}
.ld-skdash .r{display:flex;gap:8px}
.ld-skdash .t{flex:1;padding:10px;border-radius:10px;background:#fff}
.ld-skdash b{display:block;border-radius:4px;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
.ld-skdash .t b:first-child{width:60%;height:7px}
.ld-skdash .t b:last-child{width:80%;height:14px;margin-top:8px}
.ld-skdash .c{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:8px;padding:12px;border-radius:10px;background:#fff}
.ld-skdash .c b{flex:1;border-radius:3px 3px 0 0}
@keyframes ld-shim{from{background-position:150% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion: reduce){.ld-skdash,.ld-skdash *,.ld-skdash *::before,.ld-skdash *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-skdash" role="status" aria-busy="true" aria-label="加载中"><div class="r"><div class="t"><b></b><b></b></div><div class="t"><b></b><b></b></div><div class="t"><b></b><b></b></div></div><div class="c"><b style="height:40%"></b><b style="height:65%"></b><b style="height:50%"></b><b style="height:85%"></b><b style="height:60%"></b><b style="height:75%"></b><b style="height:45%"></b></div></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
