<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弹窗内容加载 · 橙色</title>
<!-- 弹窗先打开并在中间转圈，内容拿到后淡入。用于详情弹窗、抽屉。　节奏：4.4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E3651C;--ld-main-d:#C95D1F;--ld-accent:#DC834F;--ld-accent-l:#F1A87E;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A34A16;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 弹窗内容加载 */
.ld-modal{position:relative;width:250px;height:150px;border-radius:12px;background:#fff;overflow:hidden}
.ld-modal .pg{display:flex;flex-direction:column;gap:10px;padding:16px}
.ld-modal .pg b{height:9px;border-radius:5px;background:var(--ld-track)}
.ld-modal .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,24,31,.4);animation:ld-mov 4.4s ease infinite}
.ld-modal .box{position:relative;width:172px;height:104px;border-radius:10px;background:#fff;animation:ld-mbx 4.4s var(--ld-ease) infinite}
.ld-modal .sp{flex:none;display:inline-block;box-sizing:border-box;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-modal .sp{position:absolute;left:50%;top:50%;margin:-11px;animation:ld-rot .8s linear infinite,ld-msp 4.4s infinite}
.ld-modal .ct{position:absolute;inset:14px;display:flex;flex-direction:column;gap:8px;animation:ld-mct 4.4s var(--ld-ease) infinite}
.ld-modal .ct b{font-size:13px;color:var(--ld-ink)}
.ld-modal .ct i{height:7px;border-radius:4px;background:var(--ld-track)}
.ld-modal .ct u{align-self:flex-end;width:56px;height:22px;margin-top:auto;border-radius:6px;background:var(--ld-main-d)}
@keyframes ld-mov{0%{opacity:0}8%,86%{opacity:1}94%,100%{opacity:0}}
@keyframes ld-mbx{0%{transform:scale(.9)}8%,100%{transform:none}}
@keyframes ld-msp{0%,34%{opacity:1}40%,100%{opacity:0}}
@keyframes ld-mct{0%,36%{opacity:0;transform:translateY(4px)}46%,100%{opacity:1;transform:none}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-modal,.ld-modal *,.ld-modal *::before,.ld-modal *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-modal"><div class="pg" aria-hidden="true"><b style="width:55%"></b><b style="width:90%"></b><b style="width:75%"></b><b style="width:84%"></b><b style="width:62%"></b></div><div class="ov"><div class="box" role="status" aria-label="弹窗内容加载中"><i class="sp"></i><div class="ct"><b>订单详情</b><i style="width:92%"></i><i style="width:70%"></i><u></u></div></div></div></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
