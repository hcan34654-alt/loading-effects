<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>往返条 · 橙色</title>
<!-- 一小段色块在轨道里来回移动。用于不知道要多久的等待。　节奏：1.1 秒单程 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E3651C;--ld-main-d:#C95D1F;--ld-accent:#DC834F;--ld-accent-l:#F1A87E;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A34A16;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 往返条 */
.ld-pingpong{position:relative;width:150px;height:8px;border-radius:4px;background:var(--ld-track);overflow:hidden}
.ld-pingpong i{position:absolute;top:0;bottom:0;left:0;width:34%;border-radius:inherit;background:var(--ld-main);animation:ld-pp 1.1s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes ld-pp{0%{left:0;width:20%}50%{width:44%}100%{left:80%;width:20%}}
@media (prefers-reduced-motion: reduce){.ld-pingpong,.ld-pingpong *,.ld-pingpong *::before,.ld-pingpong *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-pingpong" role="status" aria-label="加载中"><i></i></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
