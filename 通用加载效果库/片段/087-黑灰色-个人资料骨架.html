<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人资料骨架 · 黑灰色</title>
<!-- 头像、昵称、三个数据块的骨架。　节奏：1.4 秒 shimmer -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#2E2E2E;--ld-main-d:#2B2B2B;--ld-accent:#8E8E8E;--ld-accent-l:#989898;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#262626;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 个人资料骨架 */
.ld-skprofile{display:flex;flex-direction:column;align-items:center;gap:10px;width:200px;padding:18px;border-radius:16px;background:#fff}
.ld-skprofile .a{width:54px;height:54px;border-radius:50%;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
.ld-skprofile b{height:9px;border-radius:5px;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
.ld-skprofile .r{display:flex;gap:10px;width:100%;margin-top:4px}
.ld-skprofile .r i{flex:1;height:34px;border-radius:8px;background:linear-gradient(90deg,#EEF0F4 25%,#F8F9FB 37%,#EEF0F4 63%);background-size:300% 100%;animation:ld-shim 1.4s linear infinite}
@keyframes ld-shim{from{background-position:150% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion: reduce){.ld-skprofile,.ld-skprofile *,.ld-skprofile *::before,.ld-skprofile *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-skprofile" role="status" aria-busy="true" aria-label="加载中"><i class="a"></i><b style="width:50%"></b><b style="width:72%"></b><div class="r"><i></i><i></i><i></i></div></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
