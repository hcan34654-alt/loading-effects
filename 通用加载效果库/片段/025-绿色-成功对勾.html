<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成功对勾 · 绿色</title>
<!-- 圆圈画完后对勾画出，再出现一行结果文字。用于提交成功、支付成功。　节奏：2.8 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#299E63;--ld-main-d:#298C5A;--ld-accent:#3AAF75;--ld-accent-l:#4CD38F;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1F7148;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 成功对勾 */
.ld-ok{display:flex;flex-direction:column;align-items:center;gap:10px}
.ld-ok svg{width:76px;height:76px;animation:ld-okp 2.8s var(--ld-ease) infinite}
.ld-ok circle,.ld-ok path{fill:none;stroke:var(--ld-ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100}
.ld-ok circle{transform:rotate(-90deg);transform-origin:38px 38px;animation:ld-okc 2.8s ease infinite}
.ld-ok path{animation:ld-okk 2.8s ease infinite}
.ld-ok p{margin:0;font-size:14px;font-weight:600;color:var(--ld-ink);animation:ld-okt 2.8s ease infinite}
@keyframes ld-okc{0%{stroke-dashoffset:100;opacity:1}35%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ld-okk{0%,30%{stroke-dashoffset:100;opacity:1}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ld-okp{0%,50%{transform:scale(1)}58%{transform:scale(1.08)}66%,100%{transform:scale(1)}}
@keyframes ld-okt{0%,50%{opacity:0;transform:translateY(4px)}62%,88%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ld-ok,.ld-ok *,.ld-ok *::before,.ld-ok *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-ok" role="status"><svg viewBox="0 0 76 76"><circle pathLength="100" cx="38" cy="38" r="34"/><path pathLength="100" d="M24 39l10 10 19-20"/></svg><p>提交成功</p></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
