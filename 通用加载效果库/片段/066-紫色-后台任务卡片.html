<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台任务卡片 · 紫色</title>
<!-- 耗时任务放到后台，角落留一张小卡片，完成后变成可点的结果。　节奏：5 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#8C49CF;--ld-main-d:#803AC6;--ld-accent:#A477D2;--ld-accent-l:#CAAAEA;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#662CA0;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 后台任务卡片 */
.ld-bgtask{display:flex;align-items:center;gap:12px;width:250px;padding:12px 14px;box-sizing:border-box;border-radius:14px;background:#fff;box-shadow:0 12px 32px rgba(20,24,31,.14)}
.ld-bgtask .ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;animation:ld-gi 5s infinite}
.ld-bgtask .ic>*{grid-area:1/1}
.ld-bgtask .sp{flex:none;display:inline-block;box-sizing:border-box;width:16px;height:16px;border-radius:50%;border:2px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-bgtask .sp{animation:ld-rot .8s linear infinite,ld-ga 5s infinite}
.ld-bgtask .ck{fill:none;stroke:var(--ld-ok);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ld-bgtask .ck{width:18px;height:18px;animation:ld-gb 5s infinite}
.ld-bgtask .tx{flex:1;display:grid}
.ld-bgtask .tx>span{grid-area:1/1;display:flex;flex-direction:column;gap:2px}
.ld-bgtask b{font-size:13px;color:var(--ld-ink)}
.ld-bgtask small{font-size:11.5px;color:var(--ld-mute)}
.ld-bgtask .a{animation:ld-ga 5s infinite}
.ld-bgtask .b{animation:ld-gb 5s infinite}
@keyframes ld-ga{0%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes ld-gb{0%,62%{opacity:0}68%,94%{opacity:1}100%{opacity:0}}
@keyframes ld-gi{0%,60%{background:#F8F1FF}68%,94%{background:#F4ECFD}100%{background:#F8F1FF}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-bgtask,.ld-bgtask *,.ld-bgtask *::before,.ld-bgtask *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-bgtask" role="status"><span class="ic"><i class="sp"></i><svg class="ck" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7"/></svg></span><span class="tx"><span class="a"><b>报告 PDF 生成中</b><small>可以离开此页，完成后通知你</small></span><span class="b"><b>报告 PDF 已生成</b><small>点击下载 · 2.4 MB</small></span></span></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
