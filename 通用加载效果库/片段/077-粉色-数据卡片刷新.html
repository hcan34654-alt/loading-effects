<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据卡片刷新 · 粉色</title>
<!-- 刷新时旧数字变淡、右上角转圈，新数字到了闪一下颜色。　节奏：约 2.6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E52A81;--ld-main-d:#D52175;--ld-accent:#DF5E9A;--ld-accent-l:#F392BF;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#AD175D;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 数据卡片刷新 */
.ld-stat{position:relative;width:180px;padding:16px 18px;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-stat small{font-size:12px;color:var(--ld-mute)}
.ld-stat .n{display:block;margin-top:6px;font:700 34px/1 var(--ld-num);color:var(--ld-ink);font-variant-numeric:tabular-nums;transition:opacity .3s,filter .3s}
.ld-stat .n u{margin-left:4px;text-decoration:none;font-size:13px;font-weight:500;color:var(--ld-mute)}
.ld-stat .n.flash{animation:ld-flash .7s}
.ld-stat .d{display:block;margin-top:8px;font-size:12px;color:var(--ld-ok)}
.ld-stat .sp{flex:none;display:inline-block;box-sizing:border-box;width:14px;height:14px;border-radius:50%;border:2px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-stat .sp{position:absolute;top:16px;right:16px;opacity:0;transition:opacity .2s}
.ld-stat[data-s=load] .n{opacity:.3;filter:blur(1.5px)}
.ld-stat[data-s=load] .sp{opacity:1}
@keyframes ld-flash{0%{color:var(--ld-main)}100%{color:var(--ld-ink)}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-stat,.ld-stat *,.ld-stat *::before,.ld-stat *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-stat" data-s="ok" aria-live="polite"><small>本周访问</small><span class="n"><span class="v">328</span><u>次</u></span><span class="d">较上周 +12%</span><i class="sp"></i></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-stat'),n=c.querySelector('.n'),v=c.querySelector('.v');
  let x=328;
  while(true){
    c.dataset.s='ok';await W(1500);
    c.dataset.s='load';await W(1100);
    x=x>=380?328:x+6+Math.floor(Math.random()*12);v.textContent=x;
    n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');
  }
}catch(e){}})();
})();
</script>
</body>
</html>
