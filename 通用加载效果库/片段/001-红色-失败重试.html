<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>失败重试 · 红色</title>
<!-- 加载失败后显示原因和重试按钮，重试成功后显示结果。可以点击试用。　节奏：约 6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E31C29;--ld-main-d:#C91F2A;--ld-accent:#DC4F58;--ld-accent-l:#F17E86;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A3161F;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 失败重试 */
.ld-retry{position:relative;width:250px;height:176px;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-retry .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .35s var(--ld-ease),transform .35s var(--ld-ease);pointer-events:none}
.ld-retry[data-s=load] .load,.ld-retry[data-s=fail] .fail,.ld-retry[data-s=ok] .ok{opacity:1;transform:none;pointer-events:auto}
.ld-retry b{font-size:14px;color:var(--ld-ink);font-weight:600}
.ld-retry small{font-size:12px;color:var(--ld-mute);margin-top:-4px}
.ld-retry .sp{width:28px;height:28px;border-radius:50%;border:3px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-retry .ex{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#FDECED;color:var(--ld-main);font:800 18px/1 var(--ld-num)}
.ld-retry[data-s=fail] .ex{animation:ld-shake .5s .15s}
.ld-retry button{height:32px;margin-top:4px;padding:0 16px;border-radius:999px;border:1px solid var(--ld-main);background:#fff;color:var(--ld-main);font:600 13px/1 inherit;font-family:inherit;cursor:pointer;transition:transform .15s,background .15s}
.ld-retry button:hover,.ld-retry button.pressed{background:#FDECED}
.ld-retry button.pressed{transform:scale(.95)}
.ld-retry .ck{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ld-ok)}
.ld-retry .ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ld-retry .ck path{stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .45s .2s var(--ld-ease)}
.ld-retry[data-s=ok] .ck path{stroke-dashoffset:0}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@keyframes ld-shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.ld-retry,.ld-retry *,.ld-retry *::before,.ld-retry *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-retry" data-s="load" role="status" aria-live="polite">
  <div class="v load"><span class="sp" aria-hidden="true"></span><b>正在加载内容</b></div>
  <div class="v fail"><span class="ex" aria-hidden="true">!</span><b>没能加载出来</b><small>网络不稳定，请再试一次</small><button type="button">重新加载</button></div>
  <div class="v ok"><span class="ck" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7"/></svg></span><b>已加载 12 条内容</b></div>
</div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-retry'),btn=c.querySelector('button');
  let go=null;btn.onclick=()=>go&&go();
  while(true){
    c.dataset.s='load';await W(1800);
    c.dataset.s='fail';
    await Promise.race([W(2000),new Promise(r=>go=r)]);go=null;
    btn.classList.add('pressed');await W(180);btn.classList.remove('pressed');
    c.dataset.s='load';await W(1300);
    c.dataset.s='ok';await W(1700);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
