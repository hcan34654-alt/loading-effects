<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新内容提示条 · 红色</title>
<!-- 有新数据时先在顶部弹出提示，点了再加载，避免正在看的内容被顶走。　节奏：约 5.6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#E31C29;--ld-main-d:#C91F2A;--ld-accent:#DC4F58;--ld-accent-l:#F17E86;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#A3161F;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 新内容提示条 */
.ld-newpill{position:relative;width:240px;height:172px;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(20,24,31,.07)}
.ld-newpill .list{display:flex;flex-direction:column;gap:8px;padding:10px}
.ld-newpill .row{flex:none;display:flex;align-items:center;height:34px;padding:0 10px;border-radius:8px;background:#F7F8FA;font-size:12px;color:var(--ld-ink2);overflow:hidden}
.ld-newpill .row.n{height:0;margin-top:-8px;opacity:0;background:#FFF3F4;transition:height .4s var(--ld-ease),margin .4s var(--ld-ease),opacity .4s,background 1.2s .6s}
.ld-newpill[data-s=done] .row.n{height:34px;margin-top:0;opacity:1;background:#F7F8FA}
.ld-newpill .pill{position:absolute;left:50%;top:12px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--ld-main);color:#fff;font-size:12px;white-space:nowrap;box-shadow:0 6px 14px rgba(227,28,41,.3);transform:translate(-50%,-48px);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.ld-newpill[data-s=new] .pill,.ld-newpill[data-s=load] .pill{transform:translate(-50%,0)}
.ld-newpill .sp{flex:none;display:inline-block;box-sizing:border-box;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:ld-rot .8s linear infinite}
.ld-newpill .sp{display:none}
.ld-newpill[data-s=load] .sp{display:inline-block}
.ld-newpill[data-s=load] .ar{display:none}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-newpill,.ld-newpill *,.ld-newpill *::before,.ld-newpill *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#F4F5F7;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-newpill" data-s="idle">
  <div class="list"><div class="row n">张伟 评论了你的文档</div><div class="row n">李娜 上传了 3 个文件</div><div class="row">王芳 收藏了 12 个文件</div><div class="row">赵磊 加入了项目</div><div class="row">陈静 更新了周报</div><div class="row">周杰 修改了权限</div></div>
  <span class="pill" role="status"><span class="ar">↑</span><i class="sp"></i><span class="t">2 条新动态</span></span>
</div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-newpill'),t=c.querySelector('.t');
  while(true){
    c.dataset.s='idle';await W(1100);
    t.textContent='2 条新动态';c.dataset.s='new';await W(1500);
    t.textContent='加载中';c.dataset.s='load';await W(900);
    c.dataset.s='done';await W(2100);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
