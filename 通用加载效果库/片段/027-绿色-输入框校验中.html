<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>输入框校验中 · 绿色</title>
<!-- 输入停下后框内转圈校验，通过后边框变绿并显示对勾。用于用户名、邀请码。　节奏：约 5 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#299E63;--ld-main-d:#298C5A;--ld-accent:#3AAF75;--ld-accent-l:#4CD38F;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1F7148;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 输入框校验中 */
.ld-inputcheck{width:250px;font-size:13px}
.ld-inputcheck label{display:block;margin-bottom:6px;color:var(--ld-ink2)}
.ld-inputcheck .box{display:flex;align-items:center;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--ld-line);background:#fff;transition:border-color .3s}
.ld-inputcheck .v{flex:1;font-size:14px;color:var(--ld-ink)}
.ld-inputcheck .v::after{content:"";display:inline-block;width:1.5px;height:16px;margin-left:1px;vertical-align:-3px;background:var(--ld-ink);animation:ld-caret 1s steps(1) infinite}
.ld-inputcheck .st{position:relative;width:18px;height:18px}
.ld-inputcheck .st>*{position:absolute;inset:0;opacity:0;transition:opacity .2s}
.ld-inputcheck .sp{flex:none;display:inline-block;box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:2px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-inputcheck .ck{fill:none;stroke:var(--ld-ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ld-inputcheck[data-s=checking] .sp,.ld-inputcheck[data-s=ok] .ck{opacity:1}
.ld-inputcheck[data-s=ok] .box{border-color:var(--ld-ok)}
.ld-inputcheck[data-s=ok] .v::after{display:none}
.ld-inputcheck .hint{margin:6px 0 0;height:18px;font-size:12px;color:var(--ld-mute)}
.ld-inputcheck[data-s=ok] .hint{color:var(--ld-ok)}
@keyframes ld-caret{50%{opacity:0}}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-inputcheck,.ld-inputcheck *,.ld-inputcheck *::before,.ld-inputcheck *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-inputcheck" data-s="typing"><label>用户名</label><div class="box"><span class="v"></span><span class="st"><i class="sp"></i><svg class="ck" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7"/></svg></span></div><p class="hint" role="status"></p></div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-inputcheck'),v=c.querySelector('.v'),h=c.querySelector('.hint');
  while(true){
    c.dataset.s='typing';v.textContent='';h.textContent='6–16 位字母或数字';await W(500);
    for(const ch of 'alex2026'){v.textContent+=ch;await W(90);}
    c.dataset.s='checking';h.textContent='正在检查是否可用…';await W(1300);
    c.dataset.s='ok';h.textContent='用户名可以使用';await W(1900);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
