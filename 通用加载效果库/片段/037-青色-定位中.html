<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定位中 · 青色</title>
<!-- 定位针上下浮动，脚下一圈圈扩散。用于获取位置。　节奏：1.8 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#229AAA;--ld-main-d:#238997;--ld-accent:#34ACBC;--ld-accent-l:#49CCDD;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1A6F7A;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 定位中 */
.ld-pin{position:relative;display:flex;flex-direction:column;align-items:center;width:160px}
.ld-pin .m{position:relative;width:160px;height:96px}
.ld-pin .m::before,.ld-pin .m::after{content:"";position:absolute;left:50%;bottom:6px;width:70px;height:26px;margin-left:-35px;border-radius:50%;border:2px solid var(--ld-main);opacity:0;animation:ld-pinr 1.8s ease-out infinite}
.ld-pin .m::after{animation-delay:.9s}
.ld-pin .p{position:absolute;left:50%;bottom:19px;width:30px;height:30px;margin-left:-15px;border-radius:50% 50% 50% 0;background:var(--ld-main);transform:rotate(-45deg);animation:ld-pinb 1.8s ease-in-out infinite}
.ld-pin .p::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.ld-pin p{margin:6px 0 0;font-size:13px;color:var(--ld-ink2)}
@keyframes ld-pinr{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes ld-pinb{0%,100%{transform:translateY(0) rotate(-45deg)}50%{transform:translateY(-8px) rotate(-45deg)}}
@media (prefers-reduced-motion: reduce){.ld-pin,.ld-pin *,.ld-pin *::before,.ld-pin *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-pin" role="status"><div class="m" aria-hidden="true"><span class="p"></span></div><p>正在定位…</p></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
