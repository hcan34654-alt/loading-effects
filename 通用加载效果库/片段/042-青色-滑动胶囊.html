<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>滑动胶囊 · 青色</title>
<!-- 胶囊在三个点之间伸长、收缩着移动。通用加载。　节奏：2.4 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#229AAA;--ld-main-d:#238997;--ld-accent:#34ACBC;--ld-accent-l:#49CCDD;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#1A6F7A;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 滑动胶囊 */
.ld-worm{position:relative;display:flex;gap:14px}
.ld-worm b{width:12px;height:12px;border-radius:50%;background:var(--ld-track)}
.ld-worm i{position:absolute;top:0;left:0;height:12px;width:12px;border-radius:6px;background:var(--ld-main);animation:ld-worm 2.4s ease-in-out infinite}
@keyframes ld-worm{0%,100%{left:0;width:12px}12%{left:0;width:38px}25%{left:26px;width:12px}37%{left:26px;width:38px}50%{left:52px;width:12px}62%{left:26px;width:38px}75%{left:26px;width:12px}87%{left:0;width:38px}}
@media (prefers-reduced-motion: reduce){.ld-worm,.ld-worm *,.ld-worm *::before,.ld-worm *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-worm" role="status" aria-label="加载中"><b></b><b></b><b></b><i></i></div>
<!-- ▲ 到这里结束 -->
</body>
</html>
