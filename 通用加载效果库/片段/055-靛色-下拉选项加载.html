<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下拉选项加载 · 靛色</title>
<!-- 选项要远程拉取时，箭头位置先转圈，拿到数据再展开菜单。　节奏：约 4.6 秒一轮 -->
<style>
/* ── 颜色令牌：改 --ld-main / --ld-accent 可换主色 ── */
:root{--ld-main:#5155D7;--ld-main-d:#4045CD;--ld-accent:#8285D9;--ld-accent-l:#BABCF0;--ld-ink:#14181F;--ld-ink2:#4A5260;
  --ld-mute:#8A93A2;--ld-line:#E3E6EC;--ld-track:#EEF0F4;--ld-ok:#2A2EAD;--ld-ease:cubic-bezier(.2,.8,.2,1);
  --ld-num:"DIN Alternate","Bahnschrift","SF Pro Display",system-ui,sans-serif}

/* ── 效果样式 ── */
/* 下拉选项加载 */
.ld-select{width:220px;height:158px}
.ld-select .box{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--ld-line);background:#fff;font-size:14px;color:var(--ld-mute);transition:.25s}
.ld-select .ic{position:relative;width:16px;height:16px}
.ld-select .ic>*{position:absolute;inset:0;transition:opacity .2s,transform .3s}
.ld-select .ch{fill:none;stroke:var(--ld-mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ld-select .sp{flex:none;display:inline-block;box-sizing:border-box;width:16px;height:16px;border-radius:50%;border:2px solid var(--ld-track);border-top-color:var(--ld-main);animation:ld-rot .8s linear infinite}
.ld-select[data-s=load] .ch,.ld-select[data-s=idle] .sp,.ld-select[data-s=open] .sp{opacity:0}
.ld-select[data-s=open] .ch{transform:rotate(180deg)}
.ld-select[data-s=open] .box{border-color:var(--ld-ink);color:var(--ld-ink)}
.ld-select .menu{margin-top:6px;padding:6px;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(20,24,31,.1);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s var(--ld-ease)}
.ld-select[data-s=open] .menu{opacity:1;transform:none}
.ld-select .menu span{display:block;height:32px;line-height:32px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--ld-ink2)}
.ld-select .menu span:first-child{background:#F7F8FA}
@keyframes ld-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ld-select,.ld-select *,.ld-select *::before,.ld-select *::after{animation-duration:2.4s!important;transition-duration:.01s!important}}

/* ── 预览舞台（复用时删掉）── */
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#FFFFFF;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<!-- ▼ 复用的 HTML 从这里开始 -->
<div class="ld-select" data-s="idle">
  <div class="box"><span class="t">选择城市</span><span class="ic"><svg class="ch" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg><i class="sp"></i></span></div>
  <div class="menu"><span>北京</span><span>上海</span><span>广州</span></div>
</div>
<!-- ▲ 到这里结束 -->
<script>
(()=>{
const root=document,sig={dead:false};
const W=ms=>new Promise((r,j)=>setTimeout(()=>sig.dead?j():r(),ms));
(async()=>{try{
  const c=root.querySelector('.ld-select'),t=c.querySelector('.t');
  while(true){
    c.dataset.s='idle';t.textContent='选择城市';await W(1100);
    c.dataset.s='load';t.textContent='城市加载中…';await W(1300);
    c.dataset.s='open';t.textContent='选择城市';await W(2200);
  }
}catch(e){}})();
})();
</script>
</body>
</html>
