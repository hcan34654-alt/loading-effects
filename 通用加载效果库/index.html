<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通用加载效果库</title>
<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#14181F;--ink2:#4A5260;--mute:#8A93A2;--line:#E3E6EC;--red:#14181F;--gold:#DCA84F;
  --ease:cubic-bezier(.2,.8,.2,1);
  --serif:"Songti SC","Noto Serif SC","STSong",serif;--sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;--mono:"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:60px 32px 96px}
header{position:relative}
header h1{font-family:var(--serif);font-size:56px;letter-spacing:.02em;margin:0 0 12px;font-weight:900;display:flex;align-items:center;gap:16px}
header h1 .mark{width:40px;height:40px;flex:none;border-radius:50%;background:conic-gradient(#E31C23,#E3651C,#E3A01C,#2A9D63,#23A0AA,#2F7BDE,#5257D6,#8C4AD2,#E82A84,#E31C23);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:hspin 3s linear infinite}
@keyframes hspin{to{transform:rotate(360deg)}}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
h2 .cdot{width:16px;height:16px;margin-right:10px;vertical-align:-1px}
.ty{margin-left:8px;padding:2px 7px;border-radius:999px;background:#F1F2F5;font:500 11px var(--sans);color:var(--mute);vertical-align:3px}
header h1 .mark rect{fill:none;stroke-width:3.5;stroke-linecap:round}
header h1 .mark .t{stroke:#E6D9C4}
header h1 .mark .d{stroke:var(--red);stroke-dasharray:142;stroke-dashoffset:142;animation:hdraw 2.4s cubic-bezier(.65,0,.35,1) infinite}
header h1 .mark text{font:800 17px var(--sans);fill:var(--red)}
@keyframes hdraw{0%{stroke-dashoffset:142}50%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-142}}
header p{margin:0;color:var(--ink2);font-size:15px;line-height:1.75;max-width:640px}
.bar{position:sticky;top:0;z-index:5;margin:32px -32px 0;padding:12px 32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:rgba(244,245,247,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
.bar.stuck{border-bottom-color:var(--line);box-shadow:0 6px 18px rgba(20,24,31,.04)}
.chip,.btn{position:relative;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);font:500 13px var(--sans);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:hover,.btn:hover{border-color:#B8BFCB;color:var(--ink)}
.chip:active,.btn:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{font-style:normal;opacity:.5;margin-left:5px;font-size:12px}
.chip .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.bar .sp{flex:1}
.bar input{height:34px;width:190px;border-radius:999px;border:1px solid var(--line);padding:0 14px;font:13px var(--sans);background:#fff;outline:none;transition:border-color .2s,width .3s var(--ease)}
.bar input:focus{border-color:var(--ink);width:230px}
.btn[aria-pressed=true]{background:#FFF4E0;border-color:#E9C98A;color:#7A5410}
section.ser{margin-top:56px;scroll-margin-top:124px}
section.ser>h2{font-family:var(--serif);font-size:28px;margin:0;font-weight:800;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
section.ser>h2 small{font-family:var(--sans);font-size:13px;color:var(--mute);font-weight:400}
section.ser>h2 .nb{font:600 11px var(--sans);color:#fff;background:var(--red);padding:3px 8px;border-radius:999px;transform:translateY(-4px)}
.grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px}
.card{position:relative;background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(20,24,31,.04);
  opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease) var(--dl,0s),transform .6s var(--ease) var(--dl,0s),box-shadow .3s var(--ease)}
.card.in{opacity:1;transform:none}
.card.in:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,24,31,.10)}
.card.wide{grid-column:span 2}
.stage{height:228px;contain:paint;position:relative;cursor:zoom-in}
.card.wide .stage{height:300px}
.tools{position:absolute;top:12px;right:12px;display:flex;gap:6px;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s var(--ease);z-index:2}
.card:hover .tools,.card:focus-within .tools{opacity:1;transform:none}
.tools button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:0;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .2s var(--ease)}
.tools button:hover{transform:scale(1.08)}
.tools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools button.spin svg{animation:rp .5s var(--ease)}
@keyframes rp{to{transform:rotate(-360deg)}}
.badge{position:absolute;top:12px;left:12px;z-index:2;font:600 11px var(--sans);color:#fff;background:var(--red);padding:3px 8px;border-radius:999px;box-shadow:0 4px 10px rgba(227,28,35,.3)}
.meta{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:800}
.meta p{margin:0;color:var(--ink2);font-size:13px;line-height:1.7;flex:1}
.foot{display:flex;align-items:center;gap:6px}
.foot .dur{font-size:12px;color:var(--mute);margin-right:auto}
.foot .btn{height:30px;font-size:12px;padding:0 12px}
.btn.ok{background:#ECFDF3;border-color:#A7E3BE;color:#127A3E}
.empty{display:none;margin-top:48px;color:var(--mute);text-align:center}
/* 详情 */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(14,17,22,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.ov.open{opacity:1;pointer-events:auto}
.panel{width:min(1080px,100%);height:min(640px,calc(100vh - 48px));display:grid;grid-template-columns:1.1fr 1fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);transform:translateY(18px) scale(.98);transition:transform .4s var(--ease)}
.ov.open .panel{transform:none}
.panel .big{position:relative;contain:paint}
.panel .side{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line)}
.panel .hd{padding:22px 24px 12px;display:flex;gap:12px;align-items:flex-start}
.panel .hd div{flex:1}
.panel h3{margin:0 0 6px;font:800 24px var(--serif)}
.panel .hd p{margin:0;color:var(--ink2);font-size:13px;line-height:1.7}
.panel .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--ink2)}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
.tabs button{position:relative;height:38px;padding:0 12px;border:0;background:none;font:600 13px var(--sans);color:var(--mute);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--red)}
.code{flex:1;margin:0;overflow:auto;padding:18px 24px;font:12px/1.65 var(--mono);color:#2B3240;background:#FAFBFC;white-space:pre-wrap;word-break:break-all;tab-size:2}
.panel .ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line)}
.panel .ft .btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
/* 规则与参考 */
.rules{margin-top:20px;background:#fff;border-radius:20px;overflow:hidden}
.rules table{width:100%;border-collapse:collapse;font-size:14px}
.rules th{text-align:left;font-weight:500;color:var(--mute);font-size:12.5px;padding:14px 20px;border-bottom:1px solid var(--line)}
.rules td{padding:14px 20px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;line-height:1.6}
.rules td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.rules td b{color:var(--ink);font-weight:600}
.rules tr:last-child td{border-bottom:0}
.rules tbody tr{transition:background .2s}
.rules tbody tr:hover{background:#FAFBFC}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.notes div{background:#fff;border-radius:16px;padding:16px 18px;font-size:13px;color:var(--ink2);line-height:1.7}
.notes b{display:block;color:var(--ink);margin-bottom:4px;font-size:14px}
.refs{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.refs div{background:#fff;border-radius:16px;padding:18px}
.refs h4{margin:0 0 6px;font-family:var(--serif);font-size:17px}
.refs p{margin:0;font-size:13px;color:var(--ink2);line-height:1.7}
.refs code{display:inline-block;margin-top:8px}
code{font:12px var(--mono);background:#F1F2F5;padding:2px 6px;border-radius:5px;color:#8A1C24}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;transition:.25s var(--ease);pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.panel{grid-template-columns:1fr;grid-template-rows:260px 1fr;height:calc(100vh - 32px)}.panel .side{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:720px){.wrap{padding:40px 18px 64px}.bar{margin:24px -18px 0;padding:10px 18px}header h1{font-size:40px}.card.wide{grid-column:auto}.bar input,.bar input:focus{width:100%}}
@media (prefers-reduced-motion: reduce){.card{transition:none;opacity:1;transform:none}header h1 .mark .d{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="mark" aria-hidden="true"></span>通用加载效果库</h1>
  <p>90 个通用的加载与等待效果，按颜色分 10 组。每个效果只用一个颜色加中性灰，状态的含义和颜色对应：红色是出错、危险、录制、未读，橙色和黄色是进行中、等待、提醒，绿色是成功、通过，其余颜色没有固定含义。悬停卡片可重播，点预览区看大图和代码。</p>
</header>
<div class="bar" id="bar" role="toolbar">
  <span id="chips" style="display:contents"></span>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="搜索：骨架、按钮、转圈…" aria-label="搜索效果">
  <button class="btn" id="pause" aria-pressed="false">暂停</button>
  <button class="btn" id="slow" aria-pressed="false">慢放</button>
</div>
<main id="main"></main>
<div class="empty" id="empty">没有匹配的效果</div>


</div>

<div class="ov" id="ov" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="big" id="big"></div>
    <div class="side">
      <div class="hd"><div><h3 id="dt"></h3><p id="dd"></p></div><button class="x" id="dx" aria-label="关闭">×</button></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <pre class="code" id="code"></pre>
      <div class="ft"><button class="btn" id="dr">重播</button><button class="btn" id="dc">复制当前</button><button class="btn pri" id="da">复制全部</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

  num.classList.remove('me');let k=23;show(k);eta.textContent='预计等待约 1 分钟，可以先离开';await W(900);
  while(k>0){k=Math.max(0,k-1-Math.floor(Math.random()*4));if(k>0){show(k);if(k<8)eta.textContent='马上就到你了';}await W(560);}
  num.classList.add('me');show('轮到你了');eta.textContent='已开始处理，约 20 秒完成';await W(2200);
}
}catch(e){}};
FX["g-pie"]=async(root,sig,W)=>{try{
const c=root.querySelector('.ld-pie'),i=c.querySelector('i'),t=c.querySelector('span');
while(true){
  for(let p=0;p<=100;p+=2){i.style.setProperty('--p',p);t.textContent=p+'%';await W(60);}
  await W(1200);
}
}catch(e){}};
FX["u-audio"]=async(root,sig,W)=>{try{
const c=root.querySelector('.ld-audio'),tm=c.querySelector('.tm');
while(true){
  c.dataset.s='load';tm.textContent='--:--';await W(1500);
  c.dataset.s='play';
  for(let s=0;s<4;s++){tm.textContent='00:0'+s+' / 03:25';await W(1000);}
}
}catch(e){}};
FX["g-sort"]=async(root,sig,W)=>{try{
const c=root.querySelector('.ld-sort'),R=[...c.querySelectorAll('.r')];
const D=[['华东一区','86,200'],['华南二区','54,900'],['华北一区','31,400'],['西南一区','12,800']];
let asc=false;
const fill=()=>{(asc?[...D].reverse():D).forEach((d,i)=>{R[i].firstChild.textContent=d[0];R[i].lastChild.textContent=d[1];});c.classList.toggle('asc',asc);};
fill();
while(true){
  c.dataset.s='idle';await W(1500);
  c.dataset.s='load';await W(1100);
  asc=!asc;fill();
}
}catch(e){}};
FX["u-avatar"]=async(root,sig,W)=>{try{
const c=root.querySelector('.ld-avatar'),av=c.querySelector('.av'),pr=c.querySelector('.pr');
while(true){
  c.classList.remove('done');let p=0;
  while(true){
    av.dataset.p=Math.round(p)+'%';pr.style.strokeDashoffset=100-p;
    if(p>=100)break;await W(200);p=Math.min(100,p+6+Math.random()*10);
  }
  await W(300);c.classList.add('done');await W(1900);
}
}catch(e){}};
FX["u-stat"]=async(root,sig,W)=>{try{
const c=root.querySelector('.ld-stat'),n=c.querySelector('.n'),v=c.querySelector('.v');
let x=328;
while(true){
  c.dataset.s='ok';await W(1500);
  c.dataset.s='load';await W(1100);
  x=x>=380?328:x+6+Math.floor(Math.random()*12);v.textContent=x;
  n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');
}
}catch(e){}};
const $=s=>document.querySelector(s);
const WIDE=new Set();
const HOST=`:host{display:grid;place-items:center;width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:host(.paused) *,:host(.paused) *::before,:host(.paused) *::after,:host(.off) *,:host(.off) *::before,:host(.off) *::after{animation-play-state:paused!important}`;
let cur="all",q="",PAUSED=false,SPEED=1;
const ICON={replay:'<svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>',zoom:'<svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg>'};

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1500)}
function copy(text,btn){
  const done=ok=>{toast(ok?"已复制":"复制失败，请打开片段文件");if(btn&&ok){const o=btn.textContent;btn.classList.add("ok");btn.textContent="✓ 已复制";setTimeout(()=>{btn.classList.remove("ok");btn.textContent=o},1300)}};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0;top:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();done(ok)};
  try{navigator.clipboard.writeText(text).then(()=>done(true),fb)}catch(e){fb()}
}
function mount(stage,d){
  if(stage._sig)stage._sig.dead=true;
  const sig={dead:false};stage._sig=sig;
  const sh=stage.shadowRoot||stage.attachShadow({mode:"open"});
  sh.innerHTML=`<style>${HOST}\n${d.shadow}</style>${d.h}`;
  const W=ms=>new Promise((res,rej)=>{
    const tick=left=>setTimeout(()=>{
      if(sig.dead)return rej(0);
      if(PAUSED||stage.classList.contains("off"))return tick(150);
      res();
    },left);
    tick(ms*SPEED);
  });
  if(FX[d.id])FX[d.id](sh,sig,W);
  applyRate(stage);
}
function applyRate(stage){try{stage.shadowRoot.getAnimations().forEach(a=>a.playbackRate=1/SPEED)}catch(e){}}
setInterval(()=>{if(SPEED!==1)document.querySelectorAll(".stage").forEach(applyRate)},400);

const io=new IntersectionObserver(es=>es.forEach(e=>{
  const c=e.target;
  if(e.isIntersecting&&!c.classList.contains("in")){c.classList.add("in");setTimeout(()=>c.style.removeProperty("--dl"),900)}
  c.querySelector(".stage").classList.toggle("off",!e.isIntersecting);
}),{rootMargin:"80px 0px"});

function render(){
  const main=$("#main");
  SER.forEach(([k,name,desc,hex])=>{
    const list=DATA.filter(d=>d.s===k);
    const sec=document.createElement("section");sec.className="ser";sec.dataset.s=k;sec.id="s-"+k;
    sec.innerHTML=`<h2><span class="cdot" style="background:${hex}"></span>${name} <small>${list.length} 个</small></h2><div class="grid"></div>`;
    const g=sec.querySelector(".grid");
    list.forEach((d,i)=>{
      const c=document.createElement("article");c.className="card"+(WIDE.has(d.id)?" wide":"");
      c.style.setProperty("--dl",(i%4)*70+"ms");
      c.dataset.text=(d.t+d.d+name+d.ty).toLowerCase();
      const btns=d.tsx?`<button class="btn" data-a="tsx">复制 TSX</button><button class="btn" data-a="css">复制 CSS</button>`:`<button class="btn" data-a="copy">复制代码</button>`;
      c.innerHTML=`${d.new?'<span class="badge">新</span>':""}<div class="tools"><button data-t="replay" aria-label="重播">${ICON.replay}</button><button data-t="zoom" aria-label="查看大图和代码">${ICON.zoom}</button></div><div class="stage" tabindex="0" aria-label="${d.t} 预览，按回车查看代码"></div><div class="meta"><h3>${d.t}<span class="ty">${d.ty}</span></h3><p>${d.d}</p><div class="foot"><span class="dur">${d.u}</span>${btns}</div></div>`;
      const st=c.querySelector(".stage");st.style.background=d.bg;
      mount(st,d);
      c.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;copy(a==="tsx"?d.tsx:a==="css"?d.css:d.copy,b)});
      c.querySelector('[data-t=replay]').onclick=e=>{const b=e.currentTarget;b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");mount(st,d)};
      c.querySelector('[data-t=zoom]').onclick=()=>openDetail(d);
      st.onclick=e=>{if(!e.composedPath().some(n=>n.tagName==="BUTTON"))openDetail(d)};
      st.onkeydown=e=>{if(e.key==="Enter")openDetail(d)};
      g.appendChild(c);io.observe(c);
    });
    main.appendChild(sec);
  });
  filter();
}
function filter(){
  let n=0;
  document.querySelectorAll("section.ser[data-s]").forEach(sec=>{
    let vis=0;
    sec.querySelectorAll(".card").forEach(c=>{const ok=(cur==="all"||sec.dataset.s===cur)&&(!q||c.dataset.text.includes(q));c.hidden=!ok;if(ok)vis++});
    sec.hidden=!vis;n+=vis;
  });
  $("#empty").style.display=n?"none":"block";
}
// 详情
let DT=null,TAB="html",lastFocus=null;
function openDetail(d){
  DT=d;lastFocus=document.activeElement;
  $("#dt").textContent=d.t;$("#dd").textContent=d.d+"　"+d.u;
  const big=$("#big");big.style.background=d.bg;mount(big,d);
  const tabs=d.tsx?[["tsx","TSX"],["css","CSS"]]:[["html","HTML"],["css","CSS"]].concat(d.js?[["js","JS"]]:[]);
  TAB=tabs[0][0];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="${k===TAB}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.k;$("#tabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b));showCode()});
  showCode();
  const ov=$("#ov");ov.classList.add("open");ov.setAttribute("aria-hidden","false");$("#dx").focus();
}
function showCode(){$("#code").textContent=DT[TAB]||"";$("#code").scrollTop=0}
function closeDetail(){const ov=$("#ov");ov.classList.remove("open");ov.setAttribute("aria-hidden","true");const big=$("#big");if(big._sig)big._sig.dead=true;lastFocus&&lastFocus.focus&&lastFocus.focus()}
$("#dx").onclick=closeDetail;
$("#ov").onclick=e=>{if(e.target.id==="ov")closeDetail()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov").classList.contains("open"))closeDetail()});
$("#dr").onclick=()=>mount($("#big"),DT);
$("#dc").onclick=e=>copy(DT[TAB]||"",e.currentTarget);
$("#da").onclick=e=>copy(DT.tsx?DT.tsx+"\n\n/* ---- CSS ---- */\n"+DT.css:DT.copy,e.currentTarget);
// 工具条
const chips=$("#chips");
[["all","全部",DATA.length],...SER.map(([k,n,_,hex])=>[k,n,DATA.filter(d=>d.s===k).length,hex])].forEach(([k,n,c,hex])=>{
  const b=document.createElement("button");b.className="chip";b.innerHTML=`${hex?`<span class="cdot" style="background:${hex}"></span>`:""}${n}<i>${c}</i>`;b.setAttribute("aria-pressed",k===cur);
  b.onclick=()=>{cur=k;chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));filter();
    const top=$("#main").getBoundingClientRect().top+scrollY-124;if(scrollY>top)scrollTo({top,behavior:"smooth"})};
  chips.appendChild(b);
});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();filter()};
$("#pause").onclick=function(){PAUSED=this.getAttribute("aria-pressed")!=="true";this.setAttribute("aria-pressed",PAUSED);this.textContent=PAUSED?"播放":"暂停";
  document.querySelectorAll(".stage,.big").forEach(s=>s.classList.toggle("paused",PAUSED))};
$("#slow").onclick=function(){const on=this.getAttribute("aria-pressed")!=="true";this.setAttribute("aria-pressed",on);SPEED=on?2:1;document.querySelectorAll(".stage,.big").forEach(applyRate)};
new IntersectionObserver(([e])=>$("#bar").classList.toggle("stuck",!e.isIntersecting),{rootMargin:"-1px 0px 0px 0px"}).observe($("header"));
render();
</script>
</body>
</html>
